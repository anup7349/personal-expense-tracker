apply plugin: "com.android.application"

android {
    namespace "com.anups.earntrack"
    compileSdk 36

    defaultConfig {
        applicationId "com.anups.earntrack"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file("../focuspulse-upload-key.jks")
            storePassword "focuspulse123"
            keyAlias "focuspulse"
            keyPassword "focuspulse123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
